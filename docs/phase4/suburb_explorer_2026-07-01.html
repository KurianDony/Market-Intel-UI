<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Suburb analytics explorer</title>
<style>
 :root{--bg:#f4f6f8;--ink:#1f2328;--mut:#6b7280;--bd:#e3e7eb}
 *{box-sizing:border-box}
 body{font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
 header{background:#fff;border-bottom:1px solid #d0d7de;padding:16px 22px}
 header h1{margin:0;font-size:18px} header p{margin:4px 0 0;color:var(--mut);font-size:12px}
 .tabs{display:flex;gap:8px;padding:14px 22px;background:#fff;border-bottom:1px solid #d0d7de;flex-wrap:wrap;position:sticky;top:0;z-index:5}
 .tab{font:13px system-ui;padding:7px 13px;border:1px solid var(--bd);border-radius:999px;background:#fff;cursor:pointer;line-height:1.1;transition:.12s}
 .tab:hover{border-color:#9aa4af} .tab.on{background:#0969da;color:#fff;border-color:#0969da}
 .tab small{display:block;font-size:9px;opacity:.85}
 main{max-width:1040px;margin:0 auto;padding:20px 16px 80px}
 section{margin:0 0 26px}
 section h2{font-size:13px;font-weight:700;letter-spacing:.02em;margin:0 0 10px;padding-left:10px;border-left:4px solid;text-transform:uppercase}
 .types{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
 .tbtn{font:12px system-ui;padding:5px 12px;border:1px solid var(--bd);border-radius:999px;background:#fff;cursor:pointer;transition:.12s;text-transform:capitalize}
 .tbtn:hover{border-color:#9aa4af} .tbtn.on{background:#1f2328;color:#fff;border-color:#1f2328}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
 .card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:13px 15px;cursor:pointer;transition:box-shadow .12s;position:relative}
 .card:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
 .card .label{font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:5px;padding-right:16px}
 .card .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
 .card .more{position:absolute;top:11px;right:12px;color:#cbd2d9;font-size:15px;font-weight:700}
 .card.open .more{color:#0969da}
 .spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}
 .spark span{flex:1;background:#cfe2ff;border-radius:2px 2px 0 0;min-height:2px}
 .card.open{grid-column:1/-1;box-shadow:0 4px 16px rgba(0,0,0,.08)}
 .detail{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
 .card.open .detail{display:block} .card.open .spark span{background:#9ec5ff}
 .d{margin:9px 0;font-size:13px} .d b{color:var(--mut)}
 table.mini{border-collapse:collapse;margin:6px 0;font-size:12px}
 table.mini th,table.mini td{border:1px solid var(--bd);padding:4px 9px;text-align:right} table.mini th{background:#f4f6f8;color:var(--mut);font-weight:600}
</style></head><body>

let idx = 0, typeSel = {};
const COL={A:'#0969da',B:'#1f8a70',C:'#8250df',D:'#bc4c00',E:'#1a7f37',F:'#6b7280',G:'#6b7280'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(v){return (v===null||v===undefined||v==='')?'<span style="color:#bbb">—</span>':esc(v);}
function secColor(t){return COL[t.trim()[0]]||'#6b7280';}
function spark(series){
  if(!series||!series.length) return '';
  const nums=series.map(p=>(typeof p.val==='number')?p.val:null);
  if(!nums.some(v=>v!==null)) return '';
  const valid=nums.filter(v=>v!==null), mx=Math.max.apply(null,valid), base=Math.min(0,Math.min.apply(null,valid));
  const bars=series.map(p=>{const v=(typeof p.val==='number')?p.val:0;const h=3+22*((v-base)/((mx-base)||1));return '<span style="height:'+h+'px" title="'+esc(p.week)+': '+esc(p.val)+'"></span>';}).join('');
  return '<div class="spark">'+bars+'</div>';
}
function detail(m){
  let s='<div class="d"><b>Where it comes from — </b>'+esc(m.source)+'</div>';
  s+='<div class="d"><b>What it shows — </b>'+esc(m.explain)+'</div>';
  if(m.series&&m.series.length){
    s+='<div class="d"><b>By week</b><br><table class="mini"><tr>'+m.series.map(p=>'<th>'+esc(p.week.slice(5))+'</th>').join('')+'</tr><tr>'+m.series.map(p=>'<td>'+fmt(p.val)+'</td>').join('')+'</tr></table></div>';
  }
  if(m.table){
    s+='<div class="d"><table class="mini"><tr>'+m.table.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+m.table.rows.map(r=>'<tr>'+r.map(x=>'<td>'+fmt(x)+'</td>').join('')+'</tr>').join('')+'</table></div>';
  }
  return s;
}
function card(m){
  return '<div class="card" onclick="this.classList.toggle(\'open\')"><div class="more">+</div>'
    +'<div class="label">'+esc(m.label)+'</div><div class="val">'+esc(String(m.value))+'</div>'
    +spark(m.series)+'<div class="detail">'+detail(m)+'</div></div>';
}
function grid(metrics){return '<div class="grid">'+metrics.map(card).join('')+'</div>';}
function setType(k,t){typeSel[k]=t;render();}
function render(){
  const sub=DATA.suburbs[idx]; let h='';
  sub.sections.forEach(function(sec,si){
    const c=secColor(sec.title);
    h+='<section><h2 style="border-color:'+c+';color:'+c+'">'+esc(sec.title)+'</h2>';
    if(sec.types){
      const k=idx+'|'+si, cur=typeSel[k]||'All';
      h+='<div class="types">'+sec.types.map(function(t){return '<button class="tbtn'+(t===cur?' on':'')+'" onclick="setType(\''+k+'\',\''+t+'\')">'+esc(t)+'</button>';}).join('')+'</div>';
      h+=grid(sec.by_type[cur]||sec.by_type['All']);
    } else {
      h+=grid(sec.metrics);
    }
    h+='</section>';
  });
  document.getElementById('body').innerHTML=h;
  var ts=document.querySelectorAll('.tab');
  for(var i=0;i<ts.length;i++) ts[i].classList.toggle('on',i===idx);
}
function pick(i){idx=i;render();window.scrollTo(0,0);}
function tabs(){
  document.getElementById('tabs').innerHTML = DATA.suburbs.map(function(s,i){
    return '<div class="tab'+(i===0?' on':'')+'" onclick="pick('+i+')">'+esc(s.name)+'<small>'+esc(s.area)+'</small></div>';}).join('');
}
tabs(); render();
</script></body></html>
